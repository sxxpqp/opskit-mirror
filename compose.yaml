services:
  mirror:
    image: registry.cn-hangzhou.aliyuncs.com/sxxpqp/opskit-mirror:${MIRROR_VERSION:?Set MIRROR_VERSION to a published commit SHA or version tag}
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./config.json:/etc/opskit-mirror/config.json:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
