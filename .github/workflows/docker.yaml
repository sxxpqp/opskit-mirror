name: Test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
      ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login
        run: |
          set -eu
          : "${ALIYUN_REGISTRY:?Missing ALIYUN_REGISTRY}"
          : "${ALIYUN_NAME_SPACE:?Missing ALIYUN_NAME_SPACE}"
          : "${ALIYUN_REGISTRY_USER:?Missing ALIYUN_REGISTRY_USER}"
          : "${ALIYUN_REGISTRY_PASSWORD:?Missing ALIYUN_REGISTRY_PASSWORD}"
          printf '%s' "$ALIYUN_REGISTRY_PASSWORD" | docker login "$ALIYUN_REGISTRY" --username "$ALIYUN_REGISTRY_USER" --password-stdin
      - name: Build and push
        run: |
          set -eu
          IMAGE="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/opskit-mirror"
          TAG="${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; fi
          TAGS=(--tag "$IMAGE:$TAG")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then TAGS+=(--tag "$IMAGE:latest"); fi
          docker buildx build --no-cache --provenance=false --sbom=false --platform linux/amd64 "${TAGS[@]}" --push .
